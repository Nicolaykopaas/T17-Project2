# CI for IT2810 prosjekt 2: lint, typecheck og enhetstester på hver push/MR.
default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

stages:
  - check
  - test

variables:
  HUSKY: '0'

lint:
  stage: check
  script:
    - npm run lint

typecheck:
  stage: check
  script:
    - npm run typecheck

unit-tests:
  stage: test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: project2_test
    POSTGRES_USER: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    TEST_DATABASE_URL: postgres://postgres@postgres:5432/project2_test
  script:
    - npm test
