# Apache-konfig for http://it2810-17.idi.ntnu.no/project2/
# Legg fila i /etc/apache2/conf-available/ og aktiver med:
#   sudo a2enmod proxy proxy_http rewrite headers expires deflate
#   sudo a2enconf apache-project2 && sudo systemctl reload apache2

# GraphQL-API: videresend til Node-backenden, som bare lytter lokalt.
ProxyPreserveHost On
ProxyPass        /project2/graphql http://127.0.0.1:3001/graphql
ProxyPassReverse /project2/graphql http://127.0.0.1:3001/graphql
# Helsesjekk (SELECT 1 mot databasen): lar sjekk.sh og overvåking skille «API nede» fra «database nede».
ProxyPass        /project2/health http://127.0.0.1:3001/health
ProxyPassReverse /project2/health http://127.0.0.1:3001/health

Alias /project2 /var/www/html/project2

<Directory /var/www/html/project2>
    Options -Indexes
    AllowOverride None
    Require all granted

    # SPA: ukjente stier (f.eks. /project2/title/tt0111161) skal gi index.html slik at
    # React Router kan håndtere dem ved direkte lasting og refresh.
    RewriteEngine On
    RewriteBase /project2/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.html [L]
</Directory>

# Sikkerhetsheadere for hele appen. Ingen av dem påvirker funksjonaliteten: siden skal aldri
# rammes inn av andre sider (clickjacking), MIME-typer skal ikke gjettes, og adressen med søket
# skal ikke lekke til andre nettsteder.
<Location /project2>
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Cross-Origin-Opener-Policy er bevisst utelatt: nettleserne ignorerer den over ren http (VM-en
    # har ikke https) og logger bare en konsollmelding om det. Legg den til igjen hvis siden får https.
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Content-Security-Policy: appen har bare to eksterne opphav, begge passive medier. Plakater
    # kommer fra TMDB (image.tmdb.org). Filmer og undertekster kommer fra Internet Archive, som
    # sender nedlastinger videre til lagringsverter som ia800000.us.archive.org (derfor wildcard).
    # Alt annet, inkludert GraphQL-kallene, går til samme opphav. Vite-bygget har ingen inline
    # skript eller stiler, så script-src og style-src trenger ikke 'unsafe-inline'.
    # E2E-testen e2e/csp.spec.ts leser denne linjen, så ikke del den over flere linjer.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://image.tmdb.org; media-src 'self' https://archive.org https://*.archive.org; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
</Location>

# Komprimer tekstressurser – store besparelser på JS/CSS/JSON for lite CPU.
<IfModule mod_deflate.c>
    # graphql-response+json er det Apollo Client 4 ber om og Yoga svarer med; uten den ble hvert
    # GraphQL-svar sendt ukomprimert. text/javascript er standard MIME for .js i nyere Apache-oppsett.
    AddOutputFilterByType DEFLATE text/html text/css text/plain text/javascript application/javascript application/json application/graphql-response+json image/svg+xml
</IfModule>

# Vite gir filene i assets/ innholdshash i navnet, så de kan caches «for alltid».
# index.html må derimot alltid revalideres, ellers får brukerne gammel kode etter deploy.
<LocationMatch "^/project2/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
<LocationMatch "^/project2/(index\.html)?$">
    Header set Cache-Control "no-cache"
</LocationMatch>
# theme-init.js har ikke hash i navnet og blokkerer første maling; en dags cache sparer en
# revalidering per sidelasting, og innholdet endres nesten aldri.
<LocationMatch "^/project2/theme-init\.js$">
    Header set Cache-Control "public, max-age=86400"
</LocationMatch>
<Location /project2/graphql>
    Header set Cache-Control "no-store"
</Location>
<Location /project2/health>
    Header set Cache-Control "no-store"
</Location>
