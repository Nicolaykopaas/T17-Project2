<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Søk, filtrer og anmeld filmer og serier fra IMDb." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0c" />
    <!-- Tomt ikon: sparer en forespørsel som ellers ender i 404. -->
    <link rel="icon" href="data:," />
    <title>Filmsøk – IT2810 gruppe 17</title>
    <!-- Setter lagret tema før første maling, ellers blinker siden i feil tema. Må holdes i synk med lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('filmsok:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
