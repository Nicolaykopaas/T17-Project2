<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Søk, filtrer og anmeld filmer og serier fra IMDb." />
    <meta name="color-scheme" content="dark light" />
    <!-- Samme farger som --bg i global.css. To tagger så adressefeltet følger systemet; valgt tema overstyrer dem i theme-init.js / useTheme. -->
    <meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <!-- Plakatene og heltebildene kommer fra TMDB; å åpne forbindelsen allerede her sparer en rundtur før første bilde. -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- Tomt ikon: sparer en forespørsel som ellers ender i 404. -->
    <link rel="icon" href="data:," />
    <title>Filmsøk – IT2810 gruppe 17</title>
    <!-- Synkront og uten defer (ikke type=module): må kjøre før første maling for å unngå blink. -->
    <script src="%BASE_URL%theme-init.js"></script>
  </head>
  <body>
    <!--
      Statisk app-skall: gir første maling (header og heltebanner-plassholder) så snart CSS er lastet, i stedet for
      etter at JS er lastet og kjørt. Samme klasser og mål som Layout/HeroSkeleton, så det ikke hopper når React
      tar over; createRoot erstatter alt under. Skallet er skjult for hjelpemidler og har ingen lenker (ingen doble
      landemerker, ingenting å klikke på som forsvinner) og varer bare noen millisekunder. Plassholderen vises bare på
      forsiden (theme-init.js setter data-hero der), ellers ville andre sider blinket med et heltebanner.
    -->
    <div id="root">
      <header class="site-header" aria-hidden="true">
        <div class="container site-header__inner">
          <a class="brand">Film<span>søk</span></a>
          <nav>
            <ul>
              <li><a>Søk</a></li>
              <li><a>Min liste</a></li>
            </ul>
          </nav>
        </div>
      </header>
      <div class="shell-hero hero hero--skeleton" aria-hidden="true">
        <div class="hero__content container">
          <div class="skeleton__line skeleton__line--title"></div>
          <div class="skeleton__line skeleton__line--short"></div>
        </div>
      </div>
      <noscript
        ><main class="container"><p>Filmsøk trenger JavaScript for å fungere.</p></main></noscript
      >
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
